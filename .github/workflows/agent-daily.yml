name: agent-daily-digest

# 数字人日更闭环：每天自动执行
#   “读取 git log 更新 -> 心理学框架生成文案 -> 调用 /api/agent/daily-digest 发布”
# 触发：UTC 03:00（北京时间 11:00）；另支持手动 workflow_dispatch 触发。
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo (with recent commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: collect latest updates (git log)
        id: updates
        run: |
          git log -8 --pretty=format:'%h %ad %s' --date=short > /tmp/updates.txt
          echo "UPDATES_JSON<<EOF" >> "$GITHUB_ENV"
          jq -Rs . < /tmp/updates.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: call daily digest (summarize -> psychology copy -> post)
        run: |
          curl -sS --max-time 180 -X POST https://www.aiabw.com/api/agent/daily-digest \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"updates\": $UPDATES_JSON, \"platforms\": \"both\"}" \
            || echo "digest call failed (check CRON_SECRET secret + Vercel env)"
